[package]
name = "obscura-browser-lab"
version = "0.1.0"
edition = "2021"
description = "Public Obscura browser integration laboratory"

[lib]
name = "obscura_browser_lab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
hex = "0.4"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "process", "time", "net", "rt", "macros"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"
dirs = "6"
