[package]
name = "iwxa-program-native-port"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Ephemeral native Rust CLI host adapter for IWXA Program Connection"

[features]
default = []
tauri-host = ["dep:tauri"]

[dependencies]
serde_json = "1"
tauri = { version = "2", optional = true, default-features = false }

[[bin]]
name = "iwxa-rust-cli-qualification"
path = "src/bin/qualify.rs"
