[package]
name = "iwxa-universal-program-ci"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
default-run = "iwxa-universal-program-ci"
description = "Public isolated real desktop GUI qualification for IWXA Program Integration"

[build-dependencies]
tauri-build = "=2.7.2"

[dependencies]
tauri = { version = "=2.12.3" }
serde_json = "1"
iwxa-program-native-port = { path = "../../../host-bindings/rust-port", features = ["tauri-host"] }

[features]
qualification-baseline = []

[[bin]]
name = "iwxa-universal-program-baseline"
path = "src/baseline.rs"
required-features = ["qualification-baseline"]
