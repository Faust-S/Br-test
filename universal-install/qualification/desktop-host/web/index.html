<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IWXA Universal Program CI</title><style>
body{font-family:Segoe UI,Arial,sans-serif;margin:26px;background:#f5f7fa;color:#18233b}
h1{font-size:23px;margin:6px 0 8px}
p{font-size:14px;color:#55627c;max-width:510px}
button{position:absolute;top:126px;left:32px;width:250px;height:56px;border:0;border-radius:8px;
background:#234e8a;color:white;font-size:17px;cursor:pointer}
button:focus{outline:3px solid #a9c9fd}
#result{position:absolute;top:207px;left:32px;font-size:16px;font-weight:600}
small{position:absolute;bottom:20px;left:32px;color:#6a7891}
</style></head>
<body>
<h1>Universal Program Integration</h1>
<p>Real installed Tauri host. The button invokes an approved Rust CLI port.</p>
<button id="invoke" type="button">Execute jq: 6 × 7</button>
<div id="result" role="status" aria-live="polite">Ready for an actual click</div>
<small>Public test fixture • No Agent, Center or Atlas data</small>
<script>
// The native command is called ONLY after a real click: no startup auto-invocation.
const button=document.getElementById("invoke");
const output=document.getElementById("result");
const schema="IWXA_PROGRAM_CONNECTION/1.0.0";
output.textContent="JavaScript ready — click to execute";
button.addEventListener("click", async () => {
 button.disabled=true;
 output.textContent="Checking the installed CLI...";
 try {
   const invoke=window.__TAURI__?.core?.invoke;
   if(typeof invoke!=="function")throw Error("TAURI_IPC_UNAVAILABLE");
   const request=(operation,payload={})=>invoke("iwxa_program_connection",{
     envelope:{schema,operation,request:payload}
   });
   const connected=await request("connect");
   if(connected.status!=="CONNECTED")throw Error("CONNECT_"+connected.status);
   const result=await request("invoke",{operation:"evaluate",params:{expression:"6 * 7"}});
   if(result.status!=="EXECUTED"||result.output.trim()!=="42")throw Error("EXECUTION_NOT_VERIFIED");
   const caps=await request("capabilities");
   if(caps.operations[0].verified!==true)throw Error("CAPABILITY_UNVERIFIED");
   const receipt=await invoke("qualification_evidence");
   if(receipt.status!=="PASS"||receipt.real_cli_output!=="42")throw Error("RECEIPT_INVALID");
   output.textContent="Verified result: 42";
 } catch(error) {
   output.textContent="Failure: "+String(error);
 } finally { button.disabled=false; }
});

</script>
</body></html>
