<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none';">
<title>IWXA Browser qualification</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <section class="context"><h1>IWXA Browser</h1><p>Стенд подключения Chromium-гостя. Это не Personal Agent.</p>
  <p id="mode" role="status">Ожидание браузера</p><button id="takeover" disabled>Управляю сам</button><button id="enable" disabled>Разрешить ИИ</button>
  <p>Внешний MCP-клиент подключается к этому же гостю через stdio. Для действий ИИ требуется явное включение.</p><p id="error" role="alert"></p></section>
  <section class="browser" aria-label="Браузер"><form id="toolbar">
  <button type="button" id="back" title="Назад">←</button><button type="button" id="forward" title="Вперёд">→</button>
  <button type="button" id="reload" title="Обновить">↻</button><button type="button" id="stop" title="Остановить">×</button>
  <input id="address" aria-label="Адрес страницы" placeholder="https://example.org" autocomplete="off" spellcheck="false">
  <button type="submit">Перейти</button></form>
  <div class="page"><webview id="guest" src="about:blank" partition="persist:iwxa-browser-qualification"></webview>
  <div class="cursor-overlay" aria-hidden="true"><div id="cursor"><img id="sprite" src="browser-cursor.svg" alt="" draggable="false"></div></div></div></section>
</main><script src="renderer.js"></script></body></html>
