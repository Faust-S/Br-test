name: Agent 0.6 headless protocol tests
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  python-headless:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python headless protocol and subprocess tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q agent-headless/iwxa_obscura agent-headless/qualification
          python -m unittest discover -s agent-headless/tests -p 'test_*.py' -v
          python -m unittest discover -s universal-install/tests -p 'test_agent06_unsigned_release_candidate.py' -v
