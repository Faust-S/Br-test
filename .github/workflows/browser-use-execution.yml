name: Agent Platforms - Browser Use public execution probe
on:
  push:
    branches:
      - research/2026-11-03-agent-execution-browser-use
    paths:
      - .github/workflows/browser-use-execution.yml
      - research/agent-platforms/browser-use/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-platform-browser-use-public
  cancel-in-progress: true

jobs:
  browser-use-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      BROWSER_USE_HEADLESS: '1'
      ANONYMIZED_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact third-party version
        run: python -m pip install --disable-pip-version-check "browser-use==0.13.14"
      - name: Install browser required by upstream library
        run: browser-use install
      - name: Run real local browser-and-HTTP effect test
        run: python research/agent-platforms/browser-use/probe.py
      - name: Save probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-browser-use-local-execution
          path: artifacts/agent-platforms/browser-use-execution.json
          if-no-files-found: warn
          retention-days: 5
