name: IWXA U04 Presentation Bridge
on:
  push:
    branches: [work/2026-11-04-u04-presentation-bridge]
    paths:
      - 'u04-presentation/**'
      - 'universal-install/qualification/desktop-host/src-tauri/src/main.rs'
      - 'universal-install/qualification/desktop-host/web/**'
      - '.github/workflows/u04-presentation-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test u04-presentation/tests/*.test.mjs
      - name: Linux X11 adapter negative contract
        if: runner.os == 'Linux'
        run: /usr/bin/python3 -m unittest discover -s u04-presentation/tests -p 'test_linux_x11.py' -v
      - name: Linux X11 real Tk host/editor GUI qualification
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool x11-utils openbox python3-tk
          xvfb-run -a -s '-screen 0 1280x800x24' bash -c 'openbox >/tmp/u04-openbox.log 2>&1 & sleep 2; /usr/bin/python3 u04-presentation/qualification/linux_x11_gui.py'
      - name: Real Wayland compositor and native GTK GUI qualification
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -qq weston python3-gi gir1.2-gtk-3.0
          mkdir -p "$RUNNER_TEMP/u04-runtime"
          chmod 700 "$RUNNER_TEMP/u04-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/u04-runtime"
          export WAYLAND_DISPLAY="wayland-u04"
          export XDG_SESSION_TYPE="wayland"
          weston --backend=headless-backend.so --renderer=pixman --socket=wayland-u04 --no-config --idle-time=0 >"$RUNNER_TEMP/u04-weston.log" 2>&1 &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then break; fi
            if ! kill -0 "$WESTON_PID" 2>/dev/null; then cat "$RUNNER_TEMP/u04-weston.log"; exit 1; fi
            sleep 0.2
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          /usr/bin/python3 -m unittest discover -s u04-presentation/tests -p 'test_linux_wayland.py' -v
          /usr/bin/python3 u04-presentation/qualification/wayland_native.py
      - name: Upload native Wayland evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: u04-linux-wayland-evidence
          path: artifacts/u04/wayland/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload X11 real GUI report
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: u04-linux-x11-evidence
          path: artifacts/u04/linux-x11/
          retention-days: 7
          if-no-files-found: ignore
      - name: macOS AppKit native process adapter compilation and negative contract
        if: runner.os == 'macOS'
        shell: bash
        run: |
          swiftc -framework AppKit u04-presentation/native/appkit_process.swift -o /tmp/iwxa-u04-appkit-process
          /tmp/iwxa-u04-appkit-process inspect "1"
          python3 -m unittest discover -s u04-presentation/tests -p 'test_macos_appkit.py' -v
      - name: Real macOS AppKit external window observation and focus
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p /tmp/IWXA-U04-Editor.app/Contents/MacOS
          swiftc -framework AppKit u04-presentation/qualification/macos_editor.swift -o /tmp/IWXA-U04-Editor.app/Contents/MacOS/iwxa-u04-editor
          python3 -c 'import plistlib; from pathlib import Path; p=Path("/tmp/IWXA-U04-Editor.app/Contents/Info.plist"); p.write_bytes(plistlib.dumps({"CFBundleExecutable":"iwxa-u04-editor","CFBundleIdentifier":"ru.iwxa.u04.ci.external-editor","CFBundleName":"IWXA U04 Editor","CFBundlePackageType":"APPL","CFBundleVersion":"1","CFBundleShortVersionString":"1.0","LSMinimumSystemVersion":"12.0","NSHighResolutionCapable":True}))'
          IWXA_U04_APPKIT_PORT=/tmp/iwxa-u04-appkit-process IWXA_U04_APPKIT_FIXTURE=/tmp/IWXA-U04-Editor.app python3 u04-presentation/qualification/macos_gui.py
      - name: Preserve real macOS AppKit GUI evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: u04-macos-gui-evidence
          path: artifacts/u04/macos-gui/
          retention-days: 7
          if-no-files-found: ignore
      - name: Native U04 Rust port negative contract
        if: runner.os == 'Windows'
        working-directory: universal-install/qualification/desktop-host/src-tauri
        run: cargo test --bin iwxa-universal-program-ci windows_port::tests -- --nocapture
  installed-windows-gui:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build existing independent Tauri qualification GUI
        shell: pwsh
        working-directory: universal-install/qualification/desktop-host
        run: |
          npm install --no-audit --no-fund
          npx tauri build
      - name: Install exact NSIS GUI candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Get-ChildItem universal-install/qualification/desktop-host/src-tauri/target/release/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if (!$build) { throw "U04_INSTALLER_NOT_BUILT" }
          $p = Start-Process -FilePath $build.FullName -ArgumentList '/S' -PassThru
          $p | Wait-Process -Timeout 90
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "U04_INSTALL_EXIT_$($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'IWXA Universal Program CI\iwxa-universal-program-ci.exe'
          if (!(Test-Path $exe)) { throw "U04_INSTALLED_EXE_MISSING" }
          $pythonw = Join-Path (Split-Path (Get-Command python).Source) 'pythonw.exe'
          if (!(Test-Path $pythonw)) { throw "U04_PYTHONW_NOT_FOUND" }
          "IWXA_INSTALLED_GUI_EXE=$exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "IWXA_U04_PYTHONW=$pythonw" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: GUI automation dependencies
        shell: pwsh
        run: python -m pip install pywinauto==0.6.9 pillow==11.3.0 psutil==7.0.0
      - name: Real Windows GUI open focus detach host restart and user document
        shell: pwsh
        timeout-minutes: 8
        run: python u04-presentation/qualification/installed_windows_gui.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u04-installed-windows-gui-evidence
          path: artifacts/u04/windows-gui/
          retention-days: 7
          if-no-files-found: ignore
