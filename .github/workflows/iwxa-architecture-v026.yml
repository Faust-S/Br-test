name: IWXA browser architecture v0.2.6
on:
  push:
    branches:
      - work/2026-11-01-browser-architecture-v026
    paths:
      - comparison/architecture_v026.py
      - .github/workflows/iwxa-architecture-v026.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tooling
        run: python -m pip install psutil==7.0.0 websocket-client==1.8.0 Pillow==11.3.0
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libasound2t64 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0
      - name: Test Obscura 0.2.6 and Gecko, then simultaneous memory
        shell: bash
        run: python comparison/architecture_v026.py
      - name: Publish raw evidence even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-v026-${{ matrix.os }}
          path: |
            artifacts/architecture-v026/*.json
            artifacts/architecture-v026/*.log
            artifacts/paired/report.json
            artifacts/paired/*.png
            artifacts/paired/*.log
          retention-days: 14
