name: IWXA U02 Source Connectors
on:
  push:
    branches: [work/2026-11-04-u02-source-connectors]
    paths:
      - 'u02-source-connectors/**'
      - '.github/workflows/u02-source-connectors.yml'
permissions:
  contents: read
concurrency:
  group: iwxa-u02-${{ github.ref }}
  cancel-in-progress: false
jobs:
  portable-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Portable U02 contract and negative tests
        shell: bash
        run: node --test u02-source-connectors/tests/*.test.mjs
  live-public-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: atlas-public
          persist-credentials: false
      - name: Live public GitHub revision and exact pinned content, no secrets
        shell: bash
        run: node u02-source-connectors/qualification/live-atlas.mjs
      - uses: actions/checkout@v4
        with:
          repository: Faust-S/Center
          ref: 87ec8f38b767222f991ee7288639fb449ddbe853
          path: center-public
          persist-credentials: false
      - name: Connect Center reader to exact canonical Atlas checkout
        shell: bash
        run: |
          mkdir -p center-public/vendor
          cp -R atlas-public center-public/vendor/atlas
      - name: U02 to real Atlas project model and Center read-only adapter
        shell: bash
        run: node u02-source-connectors/qualification/atlas-center.mjs
      - name: U02 Atlas Center persisted readback across independent processes
        shell: bash
        run: node u02-source-connectors/qualification/atlas-center-restart.mjs
      - name: U02 read-only native Center host source over canonical Atlas
        shell: bash
        run: node u02-source-connectors/qualification/center-native-host.mjs
      - name: U02 exact object Task and Atlas revision qualification
        shell: bash
        run: node u02-source-connectors/qualification/task-object-atlas.mjs
      - name: Install actual Center Vite toolchain without running package scripts
        shell: bash
        run: npm install --prefix center-public --no-audit --no-fund --ignore-scripts
      - name: Verify U02 WebView source entry with Center Vite
        shell: bash
        run: node u02-source-connectors/qualification/webview-bundle.mjs
