name: Servo IndexedDB
on:
  push:
    branches: ['work/**']
    paths: ['.github/workflows/servo-compat.yml','tests/**','probes/**']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
jobs:
  indexeddb:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    concurrency:
      group: idb-${{ matrix.os }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libgl1 libegl1 libx11-6 libxcb1 libfontconfig1 libdbus-1-3 libasound2t64 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0
      - run: python tests/idb_probe.py
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idb-${{ matrix.os }}
          path: |
            artifacts/idb-results.json
            artifacts/*.log
            artifacts/stable-*.png
          retention-days: 3
