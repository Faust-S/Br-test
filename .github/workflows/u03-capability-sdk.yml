name: U03 capability SDK (public contracts)
on:
  push:
    branches:
      - 'work/2026-11-04-u03-*'
    paths:
      - 'u03-capability-sdk/**'
      - '.github/workflows/u03-capability-sdk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Node consumers, epochs, and U01 bridging
        run: node --test u03-capability-sdk/tests/capability.test.mjs u03-capability-sdk/tests/u01-bridge.test.mjs u03-capability-sdk/tests/first-use-consumer.test.mjs u03-capability-sdk/tests/connection-epochs.test.mjs u03-capability-sdk/tests/t2-contract.test.mjs u03-capability-sdk/tests/host-binding.test.mjs
      - name: Live local HTTP API, host-owned credential loss and reattachment
        run: node u03-capability-sdk/qualification/real-u01-http.mjs
      - name: Python consumer (same public specification)
        run: python -m unittest discover -s u03-capability-sdk/tests -p 'test_*.py' -v
      - name: Independently package and install SDK into clean Node and Python hosts
        run: python u03-capability-sdk/qualification/package-smoke.py
      - name: Checkout pinned public Atlas owner source (read-only)
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: ff7669a032419f64a8e709add178f29bf84e567b
          path: atlas-owner-source
          persist-credentials: false
      - name: Real Atlas canonical owner port via installed U03 SDK and three host processes
        run: python u03-capability-sdk/qualification/atlas_owner_qualification.py atlas-owner-source
      # T2 is not anonymously accessible in public CI. Its canonical source
      # must only be inspected through an independently authorized checkout.
      # The portable JS/Python contract fixtures above are the public CI gate.

  real-u01-bridge:
    name: Real pinned jq via U01 into U03
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official pinned jq, execute via Python and Node U01 hosts, revoke, remove
        shell: bash
        run: python u03-capability-sdk/qualification/real_u01_two_consumers.py
