name: IWXA Universal Program Connection - Two Hosts
on:
  push:
    branches: [work/2026-11-04-universal-program-integration]
    paths:
      - 'universal-install/**'
      - '!universal-install/qualification/desktop-host/**'
      - '.github/workflows/universal-program-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: universal-program-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-host-programs:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert exact candidate SHA on each runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "U01_CANDIDATE_SHA=$GITHUB_SHA"
      - name: Native Rust host contract tests
        shell: bash
        run: |
          rustc --version
          cargo test --manifest-path universal-install/host-bindings/rust-port/Cargo.toml
          cargo build --manifest-path universal-install/host-bindings/rust-port/Cargo.toml --bin iwxa-rust-cli-qualification
      - name: Existing generic install contract
        shell: bash
        run: python -m unittest discover -s universal-install/tests -v
      - name: Real native DEB upgrade and old-version removal refusal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/universal-program/native
          sudo "$(command -v python)" universal-install/qualification/native_deb_smoke.py | tee artifacts/universal-program/native/deb.json
      - name: Real native RPM upgrade and old-version removal refusal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          mkdir -p artifacts/universal-program/native
          sudo "$(command -v python)" universal-install/qualification/native_rpm_smoke.py | tee artifacts/universal-program/native/rpm.json
      - name: Real native PKG upgrade with explicit vendor removal
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/universal-program/native
          sudo "$(command -v python)" universal-install/qualification/native_pkg_smoke.py | tee artifacts/universal-program/native/pkg.json
      - name: Real native MSI major upgrade with vendor UpgradeCode
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/universal-program/native
          python universal-install/qualification/native_msi_smoke.py | tee artifacts/universal-program/native/msi.json
      - name: Real vendor EXE update, corruption refusal and uninstall
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/universal-program/native
          python universal-install/qualification/native_exe_smoke.py | tee artifacts/universal-program/native/vendor-exe.json
      - name: Two genuinely installed independent programs, two host runtimes
        shell: bash
        env:
          IWXA_REQUIRE_RUST_HOST: '1'
        run: python universal-install/qualification/two_host_programs.py
      - name: Real yq software update across two official pinned releases
        shell: bash
        timeout-minutes: 6
        run: python universal-install/qualification/real_program_update.py
      - name: Agent 0.3 two independent host consumers with real executable and readback
        shell: bash
        run: node universal-install/qualification/agent03_existing_program_hosts.mjs
      - name: Real user document case through installed jq and yq with host readback
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'windows-2022' || matrix.os == 'macos-15'
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          mkdir -p artifacts/universal-program/document-case
          python universal-install/qualification/document_case.py artifacts/universal-program/document-case
      - name: Real local HTTP API connection with host-owned authorization
        shell: bash
        run: node universal-install/qualification/http_program_host.mjs
      - name: Install pinned real LiteLLM Gateway for U01 HTTP compatibility
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'litellm[proxy]==1.108.0'
          litellm --version
      - name: Actual LiteLLM Gateway routing through U01 (synthetic upstream, no model inference)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          node universal-install/qualification/real_litellm_gateway.mjs
      - name: Native Windows I3 linked-window observation and real OS readback
        if: runner.os == 'Windows'
        shell: bash
        run: python universal-install/qualification/windows_ui_link.py
      - name: Cold host startup, optional memory and idle CPU measurements
        shell: bash
        run: python universal-install/qualification/host_performance.py
      - name: Real read-only local Git source observation
        shell: bash
        run: node universal-install/qualification/local_git_host.mjs
      - name: Retrieve unmodified public Atlas observer for source compatibility test
        uses: actions/checkout@v4
        with:
          repository: Faust-S/Atlas
          ref: e5cc6ff593aa12eec3da8e8940ad5af5819b66fd
          path: atlas-public
          persist-credentials: false
      - name: Real public Atlas observer and synthetic authorized-source contract
        if: matrix.os == 'windows-2022'
        shell: bash
        run: node universal-install/qualification/github_source_host.mjs

      - name: Preserve real native package qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-u01-native-${{ matrix.os }}
          path: |
            artifacts/universal-program/native/
            artifacts/universal-program/document-case/
          retention-days: 7
          if-no-files-found: ignore

  tauri-native-ipc:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real native Tauri command IPC with pinned jq binary
        shell: bash
        run: python universal-install/qualification/tauri_ipc_smoke.py
