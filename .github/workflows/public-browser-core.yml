name: Public Obscura Browser Core — Windows Linux
on:
  push:
    branches:
      - work/2026-11-01-public-browser-core
    paths:
      - "browser-lab/src/**"
      - "browser-lab/src-tauri/**"
      - "browser-lab/index.html"
      - "browser-lab/package.json"
      - "browser-lab/tests/native_route.py"
      - ".github/workflows/public-browser-core.yml"
  workflow_dispatch:
concurrency:
  group: public-obscura-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    name: Native browser lab and real Obscura fixture
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: browser-lab
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies for Tauri and Obscura
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libgtk-3-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libasound2t64 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UI
        run: npm install --no-audit --no-fund
      - name: Compile React and TypeScript
        run: npm run build
      - name: Compile and test native controller
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Native controller check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Install real engine test dependencies
        working-directory: .
        run: python -m pip install psutil==7.0.0 websocket-client==1.8.0 Pillow==11.3.0
      - name: Actual Obscura mouse keyboard scroll tabs and history
        working-directory: .
        run: python browser-lab/tests/native_route.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-obscura-core-${{ matrix.os }}
          path: |
            artifacts/browser-lab/*.json
            artifacts/browser-lab/*.png
            artifacts/browser-lab/*.log
          retention-days: 7
