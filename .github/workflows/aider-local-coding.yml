name: IWXA Agent Platforms - Aider real coding task with local model
on:
  push:
    branches:
      - research/2026-11-03-agent-platforms-aider
    paths:
      - .github/workflows/aider-local-coding.yml
      - research/agent-platforms/aider/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iwxa-aider-real-code-research
  cancel-in-progress: true
jobs:
  aider-real-task:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact public Aider version
        run: python -m pip install --disable-pip-version-check "aider-chat==0.86.0"
      - name: Pull exact tested Ollama engine
        run: docker pull ollama/ollama:0.40.14
      - name: Start local model, no cloud keys
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iwxa-ollama-cache"
          docker run -d --rm --network host --name iwxa-aider-ollama \
            -v "$RUNNER_TEMP/iwxa-ollama-cache:/root/.ollama" \
            -e OLLAMA_HOST=127.0.0.1:11434 \
            -e OLLAMA_CONTEXT_LENGTH=8192 \
            ollama/ollama:0.40.14 serve
          for n in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags > /dev/null
          docker exec iwxa-aider-ollama ollama --version
          docker exec iwxa-aider-ollama ollama pull qwen2.5-coder:3b
      - name: Run actual Aider CLI and independent regression suite
        run: python research/agent-platforms/aider/probe.py
      - name: Preserve real Git patch and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwxa-aider-local-coding-trial
          path: artifacts/agent-platforms/aider-real-git-edit.json
          if-no-files-found: warn
          retention-days: 5
      - name: Stop local model server
        if: always()
        run: docker rm -f iwxa-aider-ollama 2>/dev/null || true
