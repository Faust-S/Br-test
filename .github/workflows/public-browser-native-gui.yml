name: Public native Tauri Obscura GUI acceptance
on:
  push:
    branches: [work/2026-11-01-public-browser-core]
    paths: ["browser-lab/src/**", "browser-lab/src-tauri/**", "browser-lab/fixtures/gui-smoke.html", "browser-lab/tests/native_gui.py", ".github/workflows/public-browser-native-gui.yml"]
  workflow_dispatch:
concurrency:
  group: public-browser-gui-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gui-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux UI and X11 requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libgtk-3-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libasound2t64 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0 xvfb xdotool openbox imagemagick
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: browser-lab/src-tauri
          key: native-gui
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build React and actual native Tauri executable
        shell: bash
        run: |
          cd browser-lab
          npm install --no-audit --no-fund
          npm run build
          cd ..
          cargo build --manifest-path browser-lab/src-tauri/Cargo.toml
      - name: Install public visual test dependencies
        run: python -m pip install Pillow==11.3.0 psutil==7.0.0 websocket-client==1.8.0
      - name: Acquire verified official Obscura v0.2.6
        shell: bash
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "comparison")
          from architecture_v026 import acquire_v026
          exe,identity=acquire_v026()
          open("/tmp/obscura-lab-path","w").write(str(exe.resolve()))
          print(identity)
          PY
      - name: Run actual Tauri window with Obscura and network-readback actions
        shell: bash
        run: |
          export OBSCURA_LAB_BINARY="$(cat /tmp/obscura-lab-path)"
          export OBSCURA_LAB_GUI_BINARY="$GITHUB_WORKSPACE/browser-lab/src-tauri/target/debug/obscura-browser-lab"
          xvfb-run -a -s "-screen 0 1280x900x24" python browser-lab/tests/native_gui.py
      - name: Upload screenshot and event evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-native-gui-linux
          path: artifacts/browser-lab/gui/
          retention-days: 7
