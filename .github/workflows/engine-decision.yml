name: Engine decision public probes
on:
  push:
    branches: ['work/2026-10-31-engine-decision']
    paths: ['comparison/**', '.github/workflows/engine-decision.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install psutil==7.0.0 websocket-client==1.8.0
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-0 libgl1 libegl1 libfontconfig1 libdbus-1-3 libasound2t64 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0
      - run: |
          npm install --prefix comparison --no-audit --no-fund react@19.2.0 react-dom@19.2.0 esbuild@0.25.0
          ./comparison/node_modules/.bin/esbuild comparison/react.jsx --bundle --outfile=comparison/react-bundle.js --minify
        shell: bash
      - run: python comparison/run.py
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-decision-${{ matrix.os }}
          path: |
            artifacts/comparison.json
            artifacts/*.png
            artifacts/*.log
            artifacts/ldd.txt
          retention-days: 14
  blitz-preact:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: DioxusLabs/blitz
          ref: e42ee1f2577f968e29ea148a75d2d4f0d2cf19cc
      - run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustc --version
          git rev-parse HEAD
          cargo test --locked -p blitz-vibey-script --test preact -- --test-threads=1
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_DEV_DEBUG: '0'
