name: IWXA Universal Install - native Obscura Windows Linux
on:
  push:
    branches: [work/2026-11-03-universal-install-module]
    paths:
      - 'universal-install/**'
      - 'agent-headless/patches/obscura-v0.2.6-agent-origin-gate.patch'
      - '.github/workflows/universal-install-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-universal-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Checkout public universal installer
        uses: actions/checkout@v4
      - name: Checkout pinned public upstream Obscura
        uses: actions/checkout@v4
        with:
          repository: h4ckf0r0day/obscura
          ref: 8534b401898ed17b62f69bdc3d5eb186bffb0d60
          path: upstream
          persist-credentials: false
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache native build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream
          key: universal-obscura-headless
      - name: Python for portable installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Verify upstream identity and apply public IWXA patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(cd upstream && git rev-parse HEAD)" = "8534b401898ed17b62f69bdc3d5eb186bffb0d60"
          (cd upstream && git apply --check ../agent-headless/patches/obscura-v0.2.6-agent-origin-gate.patch)
          (cd upstream && git apply ../agent-headless/patches/obscura-v0.2.6-agent-origin-gate.patch)
          python -c "import hashlib,pathlib; p=pathlib.Path('agent-headless/patches/obscura-v0.2.6-agent-origin-gate.patch'); print('PATCH_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())"
      - name: Test actual patched Rust origin guard
        shell: bash
        run: cargo test --manifest-path upstream/Cargo.toml --locked -p obscura-net iwxa_agent_origin_guard_tests
      - name: Build actual no-render Obscura Worker (not browser/Tauri)
        shell: bash
        run: cargo build --manifest-path upstream/Cargo.toml --locked --release -p obscura-cli --bin obscura-worker
      - name: Install actual native binary through the public universal backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/universal-install
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="upstream/target/release/obscura-worker.exe"
          else
            binary="upstream/target/release/obscura-worker"
          fi
          test -s "$binary"
          python universal-install/qualification/native_obscura_install.py \
            --binary "$binary" \
            --patch agent-headless/patches/obscura-v0.2.6-agent-origin-gate.patch \
            --report "artifacts/universal-install/native-${RUNNER_OS}.json"
      - name: Upload native evidence and executable for independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-native-obscura-${{ matrix.os }}
          path: |
            artifacts/universal-install/
            upstream/target/release/obscura-worker
            upstream/target/release/obscura-worker.exe
          if-no-files-found: warn
          retention-days: 7
