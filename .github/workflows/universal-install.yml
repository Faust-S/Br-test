name: IWXA Universal Program Install - Windows Linux
on:
  push:
    branches: [work/2026-11-03-universal-install-module]
    paths:
      - 'universal-install/**'
      - 'agent-headless/iwxa_obscura/preparer.py'
      - 'agent-headless/tests/**'
      - '.github/workflows/universal-install.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: universal-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Universal install contract and actual disk fixture
        shell: bash
        run: python -m unittest discover -s universal-install/tests -v
      - name: Real disposable DEB install, verify and remove
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo "$(command -v python)" universal-install/qualification/native_deb_smoke.py
      - name: Real disposable RPM build install and removal
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          sudo "$(command -v python)" universal-install/qualification/native_rpm_smoke.py
      - name: Real disposable macOS PKG install and receipt readback
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          sudo "$(command -v python)" universal-install/qualification/native_pkg_smoke.py
      - name: Existing public Obscura preparer regressions
        shell: bash
        run: python -m unittest discover -s agent-headless/tests -p 'test_preparer.py' -v
      - name: Public Obscura controller and worker regressions
        shell: bash
        run: PYTHONPATH=agent-headless python -m unittest discover -s agent-headless/tests -v
